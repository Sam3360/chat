<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chat — Computer Applications Grade 9th</title><meta name="theme-color" content="#2563eb"><link rel="icon" type="image/png" href="favicon.png"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="styles.css"></head><body><div class="chat-app"><header class="chat-header"><img class="app-logo" src="favicon.png" alt="Chat"><div><strong>Computer Applications 🖥️</strong><small>AVM Computer Applications Students</small></div><div class="header-spacer"></div><div class="current-user"><img id="my-avatar" alt=""><span id="my-username"></span></div><button class="quiet-button" id="logout">Log out</button></header><main class="messages" id="messages"><p class="welcome-message">This is the one global chat. Say hi 👋</p></main><section class="composer"><div class="image-preview" id="image-preview" hidden><img id="preview-image" alt="Selected image"><span id="preview-name"></span><button id="clear-image" aria-label="Remove selected image">×</button></div><div class="tag-suggestions" id="tag-suggestions" hidden></div><div class="compose-row"><label class="image-button" title="Send an image">＋<input id="image-file" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden></label><textarea id="message-text" maxlength="2000" placeholder="Message everyone — type @ to tag someone" aria-label="Message"></textarea><button class="primary-button send-button" id="send">Send</button></div><p class="composer-help">Enter sends · Shift + Enter adds a line · Images up to 5 MB</p></section></div><div class="toast" id="toast" role="status"></div><script type="module" src="chat.js"></script></body></html>
