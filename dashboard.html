<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chat — Computer Applications</title><meta name="theme-color" content="#2563eb"><link rel="icon" type="image/png" href="favicon.png"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="styles.css"></head><body><div class="chat-app"><header class="chat-header"><img class="app-logo" src="favicon.png" alt="Chat"><div><strong>Computer Applications</strong><small>AVM Computer Applications Students</small></div><div class="header-spacer"></div><button class="quiet-button" id="enable-pings">Enable pings</button><div class="current-user"><img id="my-avatar" alt=""><span id="my-username"></span></div><button class="quiet-button" id="logout">Log out</button></header><div class="workspace"><aside class="left-sidebar"><p class="side-label">Chats</p><button class="chat-link active" id="global-link"><span>#</span><b>All people</b><em id="unread-badge" hidden>0</em></button><p class="side-label">Help</p><button class="chat-link" id="support-link"><span>!</span><b>Message Samarth</b><em id="support-unread" hidden>0</em></button><p class="side-help">Private complaints and concerns only go to Samarth and the admin team.</p></aside><main class="conversation"><div class="conversation-title"><div><strong id="chat-title">All people</strong><small id="chat-subtitle">The global chat</small></div></div><section class="messages" id="messages"><p class="welcome-message">This is the one global chat. Say hi!</p></section><section class="composer"><div class="tag-suggestions" id="tag-suggestions" hidden></div><div class="compose-row"><textarea id="message-text" maxlength="2000" placeholder="Message everyone — type @ to tag someone" aria-label="Message"></textarea><button class="primary-button send-button" id="send">Send</button></div><p class="composer-help">Enter sends · Shift + Enter adds a line</p></section></main><aside class="right-sidebar"><div class="active-heading"><span class="presence-dot"></span><b>Active users</b><small id="active-count">0</small></div><div id="active-users" class="active-users"></div></aside></div></div><div class="toast" id="toast" role="status"></div><script type="module" src="chat.js"></script></body></html>
